<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مازوط سريع</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 12px; background: #0f172a; color: #f8fafc; }
    .card { max-width: 460px; margin: auto; background: #1e293b; padding: 16px; border-radius: 18px; }
    .top { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    select { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; font-weight: bold; }
    .gps { padding: 8px 10px; border-radius: 10px; font-size: 12px; font-weight: bold; background: #334155; }
    .cam { background: #000; border-radius: 14px; overflow: hidden; margin-bottom: 12px; border: 2px solid #334155; }
    video, img { width: 100%; display: block; height: 290px; object-fit: cover; }
    img { display: none; }
    .btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .snap { background: #0284c7; color: #fff; }
    .mic { background: #dc2626; color: #fff; display: none; }
    .mic.rec { background: #ea580c; box-shadow: 0 0 0 6px rgba(234,88,12,0.35); }
    .hint { text-align: center; font-size: 13px; color: #94a3b8; margin-top: 6px; }
    .status { margin-top: 12px; padding: 14px; border-radius: 12px; text-align: center; font-weight: bold; white-space: pre-line; display: none; }
    .reset { display: none; text-align: center; margin-top: 10px; color: #38bdf8; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
<div class="card">
  <div class="top">
    <select id="convoyeur">
      <option value="">-- ختار سميتك --</option>
      <option>Mehdi hanani</option>
      <option>Khalid ait musuud</option>
      <option>Elallam</option>
      <option>Driouch</option>
      <option>Oubelkhir</option>
      <option>Driss</option>
      <option>Caroserie</option>
      <option>Salah/raji</option>
      <option>Ziad youssef</option>
      <option>Elbaz</option>
      <option>Elbakkali</option>
      <option>Abdelhamid</option>
      <option>Soufiane</option>
      <option>Achraf</option>
      <option>Zakaria srm</option>
      <option>Atelier</option>
      <option>Arbih</option>
      <option>Abdellah</option>
      <option>Abdelaaty</option>
      <option>Khalid transport</option>
      <option>Ayoub transport</option>
      <option>Bahri transport</option>
      <option>Elmaari</option>
      <option>Othmane Fatihi</option>
      <option>Othmane</option>
      <option>Jerrari</option>
      <option>Meskouri</option>
      <option>Adham</option>
      <option>Elouardi</option>
      <option>Taha</option>
      <option>Hamza danami</option>
      <option>Jalal</option>
      <option>Ilias zarhloul</option>
    </select>
    <div id="gps" class="gps">📍 GPS...</div>
  </div>
  <div class="cam">
    <video id="v" autoplay playsinline></video>
    <img id="p">
  </div>
  <canvas id="c" style="display:none;"></canvas>
  <button class="btn snap" id="snapBtn">📸 1. صوّر التوصيل</button>
  <button class="btn mic" id="micBtn">🎙️ 2. ورك وقول: الماتريكول وعلاش</button>
  <div class="hint">مثال: "12345 أ 1 كونفواياج"</div>
  <div id="st" class="status"></div>
  <span class="reset" id="rst">🔄 عاود تجربة أخرى</span>
</div>
<script>
const URL_API = "https://script.google.com/macros/s/AKfycbznXJvWZ2iVf9w7ugey8XrX3psPeDTLYNnrC82FwZldfKKc2DXXZcgtL3Q4353yJvnl/exec";
const sel = document.getElementById("convoyeur"), gps = document.getElementById("gps"), snapBtn = document.getElementById("snapBtn"), micBtn = document.getElementById("micBtn"), st = document.getElementById("st"), rst = document.getElementById("rst");
let photo = null, coords = { lat: null, lng: null }, rec = null, chunks = [], isRec = false, mime = "audio/webm";

if (localStorage.getItem("conv")) sel.value = localStorage.getItem("conv");
sel.onchange = () => localStorage.setItem("conv", sel.value);

function initGPS(highAcc) {
  navigator.geolocation.getCurrentPosition(
    p => { coords = { lat: p.coords.latitude, lng: p.coords.longitude }; gps.innerText = "📍 GPS ✅"; gps.style.background = "#14532d"; },
    () => { if (highAcc) initGPS(false); else { gps.innerText = "❌ شعل GPS"; gps.style.background = "#7f1d1d"; } },
    { enableHighAccuracy: highAcc, timeout: 8000 }
  );
}
initGPS(true);

const v = document.getElementById("v"), p = document.getElementById("p");
navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }, audio: false })
  .then(s => v.srcObject = s).catch(() => alert("عطي الصلاحية للكاميرا!"));

snapBtn.onclick = () => {
  if (!sel.value) return alert("ختار سميتك الفوق بعدا!");
  if (!coords.lat) return alert("خاصك تشعل Location (GPS)!");
  if (!v.videoWidth) return alert("تسنى ثانية الكاميرا كتشعل...");
  const c = document.getElementById("c"), sc = Math.min(1, 1024 / v.videoWidth);
  c.width = v.videoWidth * sc; c.height = v.videoHeight * sc;
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  const url = c.toDataURL("image/jpeg", 0.8);
  photo = url.split(",")[1]; p.src = url;
  v.style.display = "none"; p.style.display = "block";
  snapBtn.style.display = "none"; micBtn.style.display = "block"; rst.style.display = "block";
};

micBtn.onclick = async () => {
  if (!isRec) {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ audio: true });
      let opt = {};
      if (MediaRecorder.isTypeSupported("audio/webm")) opt = { mimeType: "audio/webm" };
      else if (MediaRecorder.isTypeSupported("audio/mp4")) opt = { mimeType: "audio/mp4" };
      rec = new MediaRecorder(s, opt);
      mime = rec.mimeType || "audio/webm";
      chunks = [];
      rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      rec.onstop = () => {
        s.getTracks().forEach(t => t.stop());
        const r = new FileReader();
        r.onloadend = () => sendAll(r.result.split(",")[1]);
        r.readAsDataURL(new Blob(chunks, { type: mime }));
      };
      rec.start(); isRec = true;
      micBtn.classList.add("rec"); micBtn.innerText = "⏹️ هضر دابا... وملي تسالي ورك هنا!";
    } catch { alert("عطي الصلاحية للميكروفون!"); }
  } else {
    isRec = false; micBtn.classList.remove("rec");
    micBtn.disabled = true; micBtn.innerText = "⏳ جاري القراءة والتسجيل...";
    rec.stop();
  }
};

async function sendAll(aud) {
  try {
    const res = await fetch(URL_API, {
      method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ convoyeur: sel.value, lat: coords.lat, lng: coords.lng, photoBon: photo, audioBase64: aud, audioMime: mime })
    });
    const d = await res.json();
    st.style.display = "block";
    st.style.background = d.status === "ok" ? "#14532d" : "#7f1d1d";
    st.innerText = d.message;
    micBtn.innerText = d.status === "ok" ? "✅ تسجلات!" : "❌ وقع خطأ";
    if (d.status !== "ok") micBtn.disabled = false;
  } catch (err) {
    st.style.display = "block"; st.style.background = "#7f1d1d";
    st.innerText = "❌ خطأ: " + err.message;
    micBtn.disabled = false; micBtn.innerText = "🎙️ عاود سجل وصيفط";
  }
}
rst.onclick = () => location.reload();
</script>
</body>
</html>
